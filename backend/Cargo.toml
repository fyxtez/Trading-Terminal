[package]
name = "fyxtez-backend"
version = "1.0.0"
edition = "2024"

[features]
default = []
testnet-drills = []

[[bin]]
name = "fyxtez-testnet-drill"
path = "src/bin/testnet_drill.rs"
required-features = ["testnet-drills"]

[dependencies]
axum = { version = "0.8.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
keyring = { version = "4.2", features = ["v1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time","fs"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"


[profile.release]
strip = true        # Remove symbols from binary
opt-level = 3       
lto = true          # Optimize at link stage ("fat")
codegen-units = 1   # Reduce parallel codegen to maximize optimizations
panic = "abort"     # Remove unwind information, reducing binary size and overhead (no backtraces in production)
debug = false
incremental = false
