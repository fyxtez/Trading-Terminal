<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Fyxtez Terminal</title>
  <desc id="desc">A dark Fyxtez F mark on an amber rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="128" y1="80" x2="896" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc64a"/>
      <stop offset="0.55" stop-color="#efad31"/>
      <stop offset="1" stop-color="#c77d13"/>
    </linearGradient>
    <linearGradient id="mark" x1="260" y1="202" x2="705" y2="825" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#171b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="84" y="84" width="856" height="856" rx="198" fill="none" stroke="#ffd776" stroke-opacity="0.45" stroke-width="8"/>

  <!-- Geometric Fyxtez F, widened so it remains legible at 16–32 px. -->
  <path fill="url(#mark)" d="M244 250 798 184 705 334 422 367 333 500 161 520 326 277Z"/>
  <path fill="url(#mark)" d="M327 510 665 470 570 621 443 636 300 842 135 861 337 560Z"/>
</svg>
