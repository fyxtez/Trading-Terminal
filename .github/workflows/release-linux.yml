name: Signed Linux and Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.tauri.outputs.appVersion }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.19.1
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify tests before packaging
        working-directory: frontend
        run: npm run test:run
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
      - name: Stage Linux release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux
          mapfile -t bundles < <(
            find frontend/src-tauri/target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.AppImage' \) -print | sort
          )
          test "${#bundles[@]}" -eq 2
          cp -- "${bundles[@]}" release-assets/linux/
          (
            cd release-assets/linux
            sha256sum -- *.deb *.AppImage | sort -k2 > SHA256SUMS-linux-x86_64.txt
          )
      - name: Attest Linux artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/linux/*
      - name: Preserve attested Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signed-linux-x86_64-${{ steps.tauri.outputs.appVersion }}
          path: release-assets/linux/*
          if-no-files-found: error

  android:
    needs: linux
    runs-on: ubuntu-22.04
    environment: releases
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.19.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          printf 'NDK_HOME=%s\n' "$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing_secrets=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            printf '::error::Missing or empty releases environment secret(s): %s\n' \
              "${missing_secrets[*]}"
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fyxtez-upload.jks"
          then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not valid base64.'
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/fyxtez-upload.jks"

          if ! keytool -list \
              -keystore "$RUNNER_TEMP/fyxtez-upload.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS"
          then
            echo '::error::Keystore validation failed. Check its base64, store password, and alias.'
            exit 1
          fi

          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/fyxtez-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed Android APK and AAB
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --apk --aab --target aarch64 --ci
      - name: Verify and stage Android signatures
        run: |
          set -euo pipefail
          apk="frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          aab="frontend/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab"
          test -f "$apk"
          test -f "$aab"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify "$aab"
          mkdir -p release-assets/android
          version="${{ needs.linux.outputs.app_version }}"
          cp -- "$apk" "release-assets/android/Fyxtez.Terminal_${version}_android_arm64.apk"
          cp -- "$aab" "release-assets/android/Fyxtez.Terminal_${version}_android_arm64.aab"
          (
            cd release-assets/android
            sha256sum -- *.apk *.aab | sort -k2 > SHA256SUMS-android-arm64.txt
          )
      - name: Attest Android artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/android/*
      - name: Preserve attested Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signed-android-arm64-${{ needs.linux.outputs.app_version }}
          path: release-assets/android/*
          if-no-files-found: error
      - name: Remove decoded signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fyxtez-upload.jks"

  publish:
    needs: [linux, android]
    runs-on: ubuntu-22.04
    environment: releases
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: signed-*-${{ needs.linux.outputs.app_version }}
          path: release-assets
          merge-multiple: true
      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release-assets -maxdepth 1 -type f -name '*.deb')
          mapfile -t appimages < <(find release-assets -maxdepth 1 -type f -name '*.AppImage')
          mapfile -t apks < <(find release-assets -maxdepth 1 -type f -name '*.apk')
          mapfile -t aabs < <(find release-assets -maxdepth 1 -type f -name '*.aab')
          test "${#debs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          test "${#aabs[@]}" -eq 1
          test -f release-assets/SHA256SUMS-linux-x86_64.txt
          test -f release-assets/SHA256SUMS-android-arm64.txt
          (
            cd release-assets
            sha256sum --check SHA256SUMS-linux-x86_64.txt
            sha256sum --check SHA256SUMS-android-arm64.txt
          )
      - name: Create draft and attach complete release payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Signed release candidate. Linux users should install the `.deb` package
            on Ubuntu/Debian or use the AppImage as a portable fallback. Android is
            an arm64 preview and does not yet promise persistent background alerts.

            Every asset is covered by GitHub build-provenance attestation and the
            platform-specific SHA-256 manifest attached to this draft.
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.linux.outputs.app_version }}"
          created_release=false

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(
              gh release view "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq .isDraft
            )"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $tag already exists and is not a draft. Refusing to replace it."
              exit 1
            fi
          else
            gh release create "$tag" \
              --draft \
              --prerelease \
              --title "Fyxtez Terminal $tag" \
              --notes "$RELEASE_NOTES" \
              --repo "$GITHUB_REPOSITORY"
            created_release=true
          fi

          if ! gh release upload "$tag" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          then
            if [[ "$created_release" == "true" ]]; then
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
            fi
            echo '::error::Release upload failed; a newly-created incomplete draft was removed.'
            exit 1
          fi
      - name: Remove stale release deployment records
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t deployment_ids < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/deployments?environment=releases&per_page=100" \
              --jq '.[].id' \
              | sort -nr
          )

          if (( ${#deployment_ids[@]} <= 1 )); then
            echo 'No stale release deployments to remove.'
            exit 0
          fi

          keep_id="${deployment_ids[0]}"
          echo "Keeping newest release deployment $keep_id."

          for deployment_id in "${deployment_ids[@]:1}"; do
            if ! gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                -f state=inactive \
                -f description='Superseded by a successful release deployment.' \
                >/dev/null
            then
              echo "::warning::Could not deactivate release deployment $deployment_id."
              continue
            fi
            if ! gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id"
            then
              echo "::warning::Could not remove release deployment $deployment_id."
              continue
            fi
            echo "Removed stale release deployment $deployment_id."
          done
