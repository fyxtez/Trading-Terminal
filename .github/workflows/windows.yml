name: Windows build and smoke
on:
  push:
    branches: [master, windows-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Prepare build version
        run: node frontend/scripts/version.mjs prepare
      - name: Frontend tests on Windows
        run: npm --prefix frontend run test:ci
      - name: Backend tests on Windows
        run: cargo test --manifest-path backend/Cargo.toml --locked --all-features
      - name: Build NSIS installer with real sidecar
        env:
          VITE_TRADING_API_TOKEN: ci-token-must-not-enter-desktop-assets
        run: npm --prefix frontend run desktop:build
      - name: Verify native assets contain no development capability
        shell: pwsh
        run: |
          $hits = Get-ChildItem frontend/dist -Recurse -File | Select-String -SimpleMatch 'ci-token-must-not-enter-desktop-assets'
          if ($hits) { throw 'Native assets contain a development capability' }
      - name: Test shell and native credential store
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --locked
      - name: Install built package
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer is missing' }
          $destination = Join-Path $env:LOCALAPPDATA 'Fyxtez CI'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $executable = Join-Path $destination 'fyxtez-terminal-desktop.exe'
          if (!(Test-Path $executable)) { throw "Installed executable missing: $executable" }
          "FYXTEZ_INSTALLED_EXE=$executable" >> $env:GITHUB_ENV
          npm install --prefix "$env:RUNNER_TEMP/fyxtez-smoke" playwright-core@1.58.2
      - name: Launch installed app and exercise local runtime
        run: node frontend/scripts/ci/windows-smoke.mjs "$env:FYXTEZ_INSTALLED_EXE"
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*-setup.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-and-smoke
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            ${{ runner.temp }}/fyxtez-smoke-results/
          if-no-files-found: warn
