name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      - name: Verify desktop build strips development capabilities
        env:
          VITE_TRADING_API_TOKEN: ci-token-must-not-enter-desktop-assets
        run: |
          bash scripts/build-desktop-frontend.sh
          if grep -R -F -q 'ci-token-must-not-enter-desktop-assets' dist; then
            echo 'Desktop assets contain the development capability'
            exit 1
          fi
      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if audit_output="$(npm audit --audit-level=high 2>&1)"; then
              printf '%s\n' "$audit_output"
              exit 0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"

            if ! grep -Eiq \
              '(^|[^0-9])(429|500|502|503|504)([^0-9]|$)|Service Unavailable|Bad Gateway|Gateway Timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
              <<<"$audit_output"
            then
              exit "$audit_status"
            fi

            if (( attempt == max_attempts )); then
              echo "::error::npm audit remained unavailable after $max_attempts attempts."
              exit "$audit_status"
            fi

            delay_seconds=$((attempt * 15))
            echo "::warning::npm audit service is unavailable; retrying in ${delay_seconds}s ($attempt/$max_attempts)."
            sleep "$delay_seconds"
          done

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check backend
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Prepare development sidecar
        run: frontend/scripts/prepare-sidecar.sh debug
      - name: Check Tauri shell
        working-directory: frontend/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file backend/Cargo.lock
      - run: cargo audit --file frontend/src-tauri/Cargo.lock
