name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Prepare automatic product version
        run: npm run version:prepare
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      - name: Verify desktop build strips development capabilities
        env:
          VITE_TRADING_API_TOKEN: ci-token-must-not-enter-desktop-assets
        run: |
          bash scripts/build-desktop-frontend.sh
          if grep -R -F -q 'ci-token-must-not-enter-desktop-assets' dist; then
            echo 'Desktop assets contain the development capability'
            exit 1
          fi

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check backend
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Prepare development sidecar
        run: frontend/scripts/prepare-sidecar.sh debug
      - name: Check Tauri shell
        working-directory: frontend/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit frontend dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            -L
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file backend/Cargo.lock
      - run: cargo audit --file frontend/src-tauri/Cargo.lock

  version-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [frontend, rust, security]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Create the automatic version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node frontend/scripts/version.mjs derive)"
          tag="v$version"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to a different commit."
              exit 1
            fi
            echo "$tag already points to $GITHUB_SHA."
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Created $tag for $GITHUB_SHA."
